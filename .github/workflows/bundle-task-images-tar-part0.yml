name: Bundle Task Images Deduplicated (Manual)

on:
  workflow_dispatch:
    inputs:
      skip:
        description: "跳跃个数（从排序后第 skip+1 个开始）"
        required: true
        default: "0"
      limit:
        description: "打包镜像个数（0 = 全部剩余）"
        required: true
        default: "55"

env:
  WORKDIR: /mnt/work

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af --volumes
          df -h

      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          echo "Docker data root: $(docker info --format '{{.DockerRootDir}}')"

      - name: Set workspace to /mnt
        run: |
          sudo mkdir -p ${{ env.WORKDIR }}
          sudo chmod 777 ${{ env.WORKDIR }}
          echo "WORKDIR=${{ env.WORKDIR }}" >> $GITHUB_ENV

      - name: Copy tasks directory to workdir
        run: |
          if [ ! -d "${{ github.workspace }}/tasks" ]; then
            echo "!!! ERROR: tasks/ directory not found"
            exit 1
          fi
          cp -r "${{ github.workspace }}/tasks" "${{ env.WORKDIR }}/tasks"

      - name: Install Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3

      # ✅ 关键修复：Python 只负责输出到 stdout，shell 负责写入文件
      - name: Parse, sort and slice image list
        working-directory: ${{ env.WORKDIR }}
        env:
          SKIP: ${{ github.event.inputs.skip }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python3 -c "
          import pathlib, os, sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          SKIP = int(os.environ['SKIP'])
          LIMIT = int(os.environ['LIMIT'])

          tasks_dir = pathlib.Path('tasks')
          images = []
          for t in sorted(tasks_dir.glob('*/task.toml')):
              with open(t, 'rb') as f:
                  img = tomllib.load(f).get('environment', {}).get('docker_image')
              if img:
                  images.append(img.strip())

          unique = sorted(set(images))
          total = len(unique)

          batch = unique[SKIP:]
          if LIMIT > 0:
              batch = batch[:LIMIT]

          # 只输出到 stdout，每行一个镜像
          for img in batch:
              print(img)

          # 诊断信息输出到 stderr
          print(f'Total unique: {total} | Skip: {SKIP} | Limit: {LIMIT} | Batch: {len(batch)}', file=sys.stderr)
          " > images.txt

          echo "=== images.txt line count: $(wc -l < images.txt) ==="
          echo "=== First 5 lines ==="
          head -5 images.txt
          echo "=== Last 5 lines ==="
          tail -5 images.txt
          echo "=== Hex dump of first 200 bytes ==="
          xxd images.txt | head -15

      # ✅ 拉取前强制验证文件格式
      - name: Validate images.txt format
        working-directory: ${{ env.WORKDIR }}
        run: |
          LINE_COUNT=$(wc -l < images.txt)
          FIRST_LINE=$(head -1 images.txt)
          echo "Lines: $LINE_COUNT"
          echo "First line: [$FIRST_LINE]"
          echo "First line length: ${#FIRST_LINE}"

          # 如果只有1行且长度超过200，说明所有镜像挤在一行了
          if [ "$LINE_COUNT" -le 1 ] && [ "${#FIRST_LINE}" -gt 200 ]; then
            echo "!!! FATAL: images.txt has all images on one line!"
            echo "!!! This means the Python script did not output newlines correctly."
            exit 1
          fi

      - name: Pull and save deduplicated bundle
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail

          IMAGES=()
          while IFS= read -r line; do
            line="${line%%$'\r'}"
            [[ -z "$line" ]] && continue
            IMAGES+=("$line")
          done < images.txt
          TOTAL=${#IMAGES[@]}

          if [ "$TOTAL" -eq 0 ]; then
            echo "!!! No images to process"; exit 1
          fi

          echo "=== Will pull $TOTAL images ==="

          : > failed_images.txt
          COUNT=0
          for image in "${IMAGES[@]}"; do
            COUNT=$((COUNT + 1))
            echo "=== [$COUNT/$TOTAL] Pulling $image ==="
            docker pull "$image" || echo "$image" >> failed_images.txt
          done

          echo ""
          echo "=== Pull complete: $COUNT attempted ==="

          SUCCESSFUL=()
          while IFS= read -r line; do
            line="${line%%$'\r'}"
            [[ -z "$line" ]] && continue
            grep -qxF "$line" failed_images.txt 2>/dev/null || SUCCESSFUL+=("$line")
          done < images.txt

          if [ ${#SUCCESSFUL[@]} -eq 0 ]; then
            echo "!!! All pulls failed";
