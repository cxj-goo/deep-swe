name: Bundle Task Images Deduplicated (Manual)

on:
  workflow_dispatch:
    inputs:
      skip:
        description: "跳跃个数（从排序后第 skip+1 个开始）"
        required: true
        default: "0"
      limit:
        description: "打包镜像个数（0 = 全部剩余）"
        required: true
        default: "55"

env:
  WORKDIR: /mnt/work

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af --volumes
          df -h

      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          echo "Docker data root: $(docker info --format '{{.DockerRootDir}}')"

      - name: Set workspace to /mnt
        run: |
          sudo mkdir -p ${{ env.WORKDIR }}
          sudo chmod 777 ${{ env.WORKDIR }}
          echo "WORKDIR=${{ env.WORKDIR }}" >> $GITHUB_ENV

      - name: Copy tasks directory to workdir
        run: |
          if [ ! -d "${{ github.workspace }}/tasks" ]; then
            echo "!!! ERROR: tasks/ directory not found"
            exit 1
          fi
          cp -r "${{ github.workspace }}/tasks" "${{ env.WORKDIR }}/tasks"

      - name: Install Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3

      - name: Parse, sort and slice image list
        working-directory: ${{ env.WORKDIR }}
        env:
          SKIP: ${{ github.event.inputs.skip }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          python3 -c "
          import pathlib, os, sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          SKIP = int(os.environ['SKIP'])
          LIMIT = int(os.environ['LIMIT'])
          tasks_dir = pathlib.Path('tasks')
          images = []
          for t in sorted(tasks_dir.glob('*/task.toml')):
              with open(t, 'rb') as f:
                  img = tomllib.load(f).get('environment', {}).get('docker_image')
              if img:
                  images.append(img.strip())
          unique = sorted(set(images))
          total = len(unique)
          batch = unique[SKIP:]
          if LIMIT > 0:
              batch = batch[:LIMIT]
          for img in batch:
              print(img)
          print(f'Total: {total} | Skip: {SKIP} | Limit: {LIMIT} | Batch: {len(batch)}', file=sys.stderr)
          " > images.txt

          echo "=== images.txt: $(wc -l < images.txt) lines ==="
          head -3 images.txt
          echo "..."
          tail -3 images.txt

      - name: Validate images.txt format
        working-directory: ${{ env.WORKDIR }}
        run: |
          LINE_COUNT=$(wc -l < images.txt)
          FIRST_LINE=$(head -1 images.txt)
          echo "Lines: $LINE_COUNT | First line length: ${#FIRST_LINE}"
          if [ "$LINE_COUNT" -le 1 ] && [ "${#FIRST_LINE}" -gt 200 ]; then
            echo "!!! FATAL: all images on one line"; exit 1
          fi

      # ✅ 关键修复：skip/limit 通过 env 传入，不在 shell 中内联展开 ${{ }}
      - name: Pull and save deduplicated bundle
        working-directory: ${{ env.WORKDIR }}
        env:
          INPUT_SKIP: ${{ github.event.inputs.skip }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -euo pipefail

          IMAGES=()
          while IFS= read -r line; do
            line="${line%%$'\r'}"
            [[ -z "$line" ]] && continue
            IMAGES+=("$line")
          done < images.txt
          TOTAL=${#IMAGES[@]}

          if [ "$TOTAL" -eq 0 ]; then
            echo "!!! No images to process"
            exit 1
          fi

          echo "=== Will pull $TOTAL images ==="

          : > failed_images.txt
          COUNT=0
          for image in "${IMAGES[@]}"; do
            COUNT=$((COUNT + 1))
            echo "=== [$COUNT/$TOTAL] Pulling $image ==="
            docker pull "$image" || echo "$image" >> failed_images.txt
          done

          echo ""
          echo "=== Pull complete: $COUNT attempted ==="

          SUCCESSFUL=()
          while IFS= read -r line; do
            line="${line%%$'\r'}"
            [[ -z "$line" ]] && continue
            grep -qxF "$line" failed_images.txt 2>/dev/null || SUCCESSFUL+=("$line")
          done < images.txt

          if [ ${#SUCCESSFUL[@]} -eq 0 ]; then
            echo "!!! All pulls failed"
            exit 1
          fi

          TAR="task-images-skip${INPUT_SKIP}-limit${INPUT_LIMIT}.tar"

          echo "=== Saving ${#SUCCESSFUL[@]} images to $TAR (deduplicated) ==="
          docker save "${SUCCESSFUL[@]}" -o "$TAR"
          ls -lh "$TAR"

          if [ -s failed_images.txt ]; then
            echo ""
            echo "Failed images:"
            cat failed_images.txt
          fi

          echo ""
          df -h /mnt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-images-skip${{ github.event.inputs.skip }}-limit${{ github.event.inputs.limit }}
          path: ${{ env.WORKDIR }}/task-images-skip${{ github.event.inputs.skip }}-limit${{ github.event.inputs.limit }}.tar
          retention-days: 7
