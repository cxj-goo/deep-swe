name: Bundle Task Images Deduplicated (Manual)-part0

on:
  workflow_dispatch:
    inputs:
      skip:
        description: '跳跃个数（从排序后第 skip+1 个开始）'
        required: true
        default: '0'
      limit:
        description: '打包镜像个数（0 = 全部剩余）'
        required: true
        default: '55'

env:
  WORKDIR: /mnt/work

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========== 磁盘空间优化 ==========
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af --volumes
          df -h

      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          echo "Docker data root: $(docker info --format '{{.DockerRootDir}}')"

      - name: Set workspace to /mnt
        run: |
          sudo mkdir -p ${{ env.WORKDIR }}
          sudo chmod 777 ${{ env.WORKDIR }}
          echo "WORKDIR=${{ env.WORKDIR }}" >> $GITHUB_ENV

      - name: Copy tasks directory to workdir
        run: |
          if [ ! -d "${{ github.workspace }}/tasks" ]; then
            echo "!!! ERROR: tasks/ directory not found"
            exit 1
          fi
          cp -r "${{ github.workspace }}/tasks" "${{ env.WORKDIR }}/tasks"

      # ========== 解析 + 确定性排序 + 分页 ==========
      - name: Install Python 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3

      - name: Parse, sort and slice image list
        working-directory: ${{ env.WORKDIR }}
        env:
          SKIP: ${{ github.event.inputs.skip }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          cat > parse_images.py << 'PYEOF'
          import pathlib, os
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          SKIP = int(os.environ["SKIP"])
          LIMIT = int(os.environ["LIMIT"])

          tasks_dir = pathlib.Path("tasks")
          images = []
          for t in sorted(tasks_dir.glob("*/task.toml")):
              with open(t, "rb") as f:
                  img = tomllib.load(f).get("environment", {}).get("docker_image")
              if img:
                  images.append(img.strip())

          # ✅ 确定性排序 + 去重
          unique = sorted(set(images))
          total = len(unique)

          # ✅ 分页切片
          batch = unique[SKIP:]
          if LIMIT > 0:
              batch = batch[:LIMIT]

          pathlib.Path("images.txt").write_text(" ".join(batch) + " ")

          print(f"Total unique: {total} | Skip: {SKIP} | Limit: {LIMIT} | Batch: {len(batch)}")
          for i, img in enumerate(batch):
              print(f" [{SKIP+i}] {img}")
          PYEOF

          python3 parse_images.py
          echo "=== images.txt ($(wc -l < images.txt) lines) ==="
          cat images.txt

      # ========== 拉取 + 单次 docker save 去重打包 ==========
      - name: Pull and save deduplicated bundle
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          mapfile -t IMAGES < images.txt
          TOTAL=${#IMAGES[@]}

          if [ "$TOTAL" -eq 0 ] || { [ "$TOTAL" -eq 1 ] && [ -z "${IMAGES[0]}" ]; }; then
            echo "!!! No images to process"; exit 1
          fi

          : > failed_images.txt
          COUNT=0
          for image in "${IMAGES[@]}"; do
            [ -z "$image" ] && continue
            COUNT=$((COUNT + 1))
            echo "=== [$COUNT/$TOTAL] Pulling $image ==="
            docker pull "$image" || echo "$image" >> failed_images.txt
          done

          # 过滤失败镜像
          SUCCESSFUL=()
          while IFS= read -r line; do
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            grep -qxF "$line" failed_images.txt 2>/dev/null || SUCCESSFUL+=("$line")
          done < images.txt

          if [ ${#SUCCESSFUL[@]} -eq 0 ]; then
            echo "!!! All pulls failed"; exit 1
          fi

          SKIP=${{ github.event.inputs.skip }}
          LIMIT=${{ github.event.inputs.limit }}
          TAR="task-images-skip${SKIP}-limit${LIMIT}.tar"

          # ✅ 关键：所有镜像作为参数一次性传入 docker save
          # Docker 内部按 layer digest 去重，相同层只写入一次
          echo "=== Saving ${#SUCCESSFUL[@]} images → $TAR (deduplicated) ==="
          docker save "${SUCCESSFUL[@]}" -o "$TAR"
          ls -lh "$TAR"

          [ -s failed_images.txt ] && { echo "Failed:"; cat failed_images.txt; }
          df -h /mnt

      # ========== 上传 ==========
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-images-skip${{ github.event.inputs.skip }}-limit${{ github.event.inputs.limit }}
          path: ${{ env.WORKDIR }}/task-images-skip${{ github.event.inputs.skip }}-limit${{ github.event.inputs.limit }}.tar
          retention-days: 7
