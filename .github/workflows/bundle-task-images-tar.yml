name: Bundle Task Images Deduplicated (Manual)

on:
  workflow_dispatch: {}

env:
  WORKDIR: /mnt/work

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========== 磁盘空间优化 ==========
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker system prune -af --volumes
          df -h

      - name: Move Docker data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          sudo ln -s /mnt/docker /var/lib/docker
          sudo systemctl start docker
          echo "Docker data root: $(docker info --format '{{.DockerRootDir}}')"

      - name: Set workspace to /mnt
        run: |
          sudo mkdir -p ${{ env.WORKDIR }}
          sudo chmod 777 ${{ env.WORKDIR }}
          echo "WORKDIR=${{ env.WORKDIR }}" >> $GITHUB_ENV

      # ========== 复制代码到工作目录 ==========
      - name: Copy tasks directory to workdir
        run: |
          if [ ! -d "${{ github.workspace }}/tasks" ]; then
            echo "!!! ERROR: tasks/ directory not found in repository"
            ls -la "${{ github.workspace }}"
            exit 1
          fi
          cp -r "${{ github.workspace }}/tasks" "${{ env.WORKDIR }}/tasks"
          echo "Copied tasks/ to ${{ env.WORKDIR }}/tasks"
          ls "${{ env.WORKDIR }}/tasks" | head -20

      # ========== 解析镜像列表 ==========
      - name: Install Python 3 from system package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3

      - name: Write task.toml parser script
        run: |
          cat > "${{ env.WORKDIR }}/parse_images.py" << 'EOF'
          import pathlib

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          tasks_dir = pathlib.Path("tasks")
          task_tomls = sorted(tasks_dir.glob("*/task.toml"))

          images = []
          missing = []
          for t in task_tomls:
              with open(t, "rb") as f:
                  data = tomllib.load(f)
              image = data.get("environment", {}).get("docker_image")
              if image:
                  images.append(image)
              else:
                  missing.append(str(t))

          unique_images = sorted(set(images))
          pathlib.Path("images.txt").write_text("\n".join(unique_images) + "\n")

          print(f"task.toml files found: {len(task_tomls)}")
          print(f"unique docker_image values: {len(unique_images)}")
          if missing:
              print("WARNING: no docker_image in:")
              for m in missing:
                  print(f"  - {m}")
          EOF

      - name: Parse all task.toml docker_image fields
        working-directory: ${{ env.WORKDIR }}
        run: |
          python3 parse_images.py
          echo ""
          echo "=== images.txt content ==="
          cat images.txt
          echo "=== Line count: $(wc -l < images.txt) ==="

      # ========== 拉取并合并打包 ==========
      - name: Pull every task image with progress, then save all to single deduplicated tar
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -euo pipefail
          mapfile -t IMAGES < images.txt
          TOTAL=${#IMAGES[@]}
          COUNT=0
          : > failed_images.txt

          if [ "$TOTAL" -eq 0 ] || { [ "$TOTAL" -eq 1 ] && [ -z "${IMAGES[0]}" ]; }; then
            echo "!!! ERROR: images.txt is empty or contains only blank lines"
            echo "Please check that tasks/*/task.toml files contain environment.docker_image"
            exit 1
          fi

          # Phase 1: Pull each image individually with progress
          for image in "${IMAGES[@]}"; do
            [ -z "$image" ] && continue
            COUNT=$((COUNT + 1))
            echo "=== [$COUNT / $TOTAL] Pulling $image ==="
            if ! docker pull "$image"; then
              echo "!!! FAILED: $image"
              echo "$image" >> failed_images.txt
            fi
          done

          echo ""
          echo "=== Pull phase complete: $COUNT / $TOTAL ==="

          # Phase 2: Save all successfully pulled images into ONE tar (shared layers deduplicated)
          SUCCESSFUL_IMAGES=()
          while IFS= read -r line; do
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            if ! grep -qxF "$line" failed_images.txt 2>/dev/null; then
              SUCCESSFUL_IMAGES+=("$line")
            fi
          done < images.txt

          OUTPUT_TAR="task-images-bundle.tar"

          if [ ${#SUCCESSFUL_IMAGES[@]} -gt 0 ]; then
            echo "=== Saving ${#SUCCESSFUL_IMAGES[@]} images to ${OUTPUT_TAR} (shared layers deduplicated) ==="
            docker save "${SUCCESSFUL_IMAGES[@]}" -o "${OUTPUT_TAR}"
            ls -lh "${OUTPUT_TAR}"
            echo "=== Save complete ==="
          else
            echo "!!! No images were successfully pulled, skipping save."
            exit 1
          fi

          if [ -s failed_images.txt ]; then
            echo ""
            echo "Failed images:"
            cat failed_images.txt
          fi

          echo ""
          echo "=== Final disk usage ==="
          df -h /mnt

      # ========== 上传产物 ==========
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-images-bundle
          path: ${{ env.WORKDIR }}/task-images-bundle.tar
          retention-days: 7
